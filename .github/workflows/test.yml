name: Test

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Core tests
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select latest Xcode
        run: |
          LATEST="$(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "${LATEST}" ]]; then
            echo "Using ${LATEST}"
            sudo xcode-select -s "${LATEST}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-test-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-test-
            ${{ runner.os }}-swiftpm-

      - name: Resolve packages
        run: swift package resolve

      - name: Run core tests
        run: make test

      - name: Build app (compile check)
        run: make build
