name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to release (e.g. v1.0.0). Leave empty when triggered by a tag push."
        required: false
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build, release, and publish package
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: meta
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && -n "${{ inputs.tag }}" ]]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          if [[ ! "${TAG}" =~ ^v[0-9] ]]; then
            echo "error: expected a version tag like v1.0.0, got '${TAG}'" >&2
            exit 1
          fi
          VERSION="${TAG#v}"
          OWNER_LC="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          PACKAGE="ghcr.io/${OWNER_LC}/${REPO_LC}/macos"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "zip=KeyboardSourceLocker-${TAG}-macos.zip" >> "${GITHUB_OUTPUT}"
          echo "package=${PACKAGE}" >> "${GITHUB_OUTPUT}"

      - name: Select latest Xcode
        run: |
          LATEST="$(ls -1d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [[ -n "${LATEST}" ]]; then
            echo "Using ${LATEST}"
            sudo xcode-select -s "${LATEST}/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Cache SwiftPM
        uses: actions/cache@v6
        with:
          path: .build
          key: ${{ runner.os }}-swiftpm-release-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-swiftpm-release-
            ${{ runner.os }}-swiftpm-

      - name: Resolve packages
        run: swift package resolve

      - name: Run core tests
        run: make test

      - name: Verify git tag matches package.json
        run: |
          set -euo pipefail
          PKG_VERSION="$(swift run -c release VersionTool)"
          TAG="${{ steps.meta.outputs.tag }}"
          if [[ "v${PKG_VERSION}" != "${TAG}" ]]; then
            echo "error: git tag ${TAG} does not match package.json version ${PKG_VERSION}" >&2
            echo "Bump package.json (e.g. npm run release / bumpp) before tagging." >&2
            exit 1
          fi
          echo "OK: ${TAG} == package.json ${PKG_VERSION}"

      - name: Build and package .app
        run: make package

      - name: Zip app bundle
        run: |
          cd dist
          ditto -c -k --keepParent KeyboardSourceLocker.app "${{ steps.meta.outputs.zip }}"
          shasum -a 256 "${{ steps.meta.outputs.zip }}" | tee "${{ steps.meta.outputs.zip }}.sha256"
          ls -lh "${{ steps.meta.outputs.zip }}"*

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: Keyboard Source Locker ${{ steps.meta.outputs.tag }}
          generate_release_notes: true
          body: |
            ## Install
            1. Download `KeyboardSourceLocker-${{ steps.meta.outputs.tag }}-macos.zip`
            2. Unzip and move `KeyboardSourceLocker.app` to `/Applications`
            3. Launch — look for the lock icon in the menu bar

            Ad-hoc signed. If macOS blocks open: **System Settings → Privacy & Security → Open Anyway**.

            ## GitHub Package (GHCR)
            ```bash
            oras pull ${{ steps.meta.outputs.package }}:${{ steps.meta.outputs.tag }}
            ```
          files: |
            dist/${{ steps.meta.outputs.zip }}
            dist/${{ steps.meta.outputs.zip }}.sha256
            .build/release/KeyboardSourceLockerApp
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup ORAS
        uses: oras-project/setup-oras@v1

      - name: Publish macOS zip to GitHub Packages (GHCR)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PACKAGE: ${{ steps.meta.outputs.package }}
          TAG: ${{ steps.meta.outputs.tag }}
          ZIP: ${{ steps.meta.outputs.zip }}
          REPO_URL: https://github.com/${{ github.repository }}
        run: |
          set -euo pipefail
          echo "${GITHUB_TOKEN}" | oras login ghcr.io \
            --username "${{ github.actor }}" \
            --password-stdin

          push_tag() {
            local ref="$1"
            oras push "${ref}" \
              --artifact-type application/vnd.heyq02.keyboard-source-locker.macos+zip \
              --annotation "org.opencontainers.image.source=${REPO_URL}" \
              --annotation "org.opencontainers.image.version=${TAG}" \
              --annotation "org.opencontainers.image.title=Keyboard Source Locker" \
              --annotation "org.opencontainers.image.description=macOS menu-bar Keyboard Source Locker app bundle (${TAG})" \
              "dist/${ZIP}:application/zip" \
              "dist/${ZIP}.sha256:text/plain"
          }

          push_tag "${PACKAGE}:${TAG}"
          push_tag "${PACKAGE}:latest"
          echo "Published ${PACKAGE}:${TAG} and ${PACKAGE}:latest"

      - name: Package URL
        run: |
          REPO_LC="$(echo '${{ github.event.repository.name }}' | tr '[:upper:]' '[:lower:]')"
          echo "GHCR package: ${{ steps.meta.outputs.package }}:${{ steps.meta.outputs.tag }}"
          echo "UI: https://github.com/${{ github.repository }}/pkgs/container/${REPO_LC}%2Fmacos"
          echo "If the package is private, set visibility to Public under GitHub → Packages."
