name: Bug report
description: Something is not working as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can — it speeds up fixes a lot.
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: One or two sentences describing the problem.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Numbered steps, starting from a clean launch if possible.
      placeholder: |
        1. Launch Keyboard Source Locker
        2. Select …
        3. Turn Lock On
        4. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: macos
    attributes:
      label: macOS version
      placeholder: e.g. 15.6 / 26.x
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: App version
      description: Git tag, commit SHA, or “built from main”.
      placeholder: v0.1.0
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Input sources involved
      description: Locked target, what you switched to, and any third-party IMEs.
      placeholder: Locked to 微信输入法; switched to ABC
  - type: textarea
    id: extras
    attributes:
      label: Additional context
      description: Screenshots, Console logs, or anything else useful.
